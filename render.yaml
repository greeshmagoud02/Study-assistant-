services:
  - type: web
    name: study-assistant-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: CLIENT_ORIGIN
        sync: false
      # Temporary free-tier provider override — remove once ANTHROPIC_API_KEY
      # has credits (see server/services/claudeService.js).
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
